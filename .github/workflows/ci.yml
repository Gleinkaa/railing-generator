name: CI

on:
  push:
  pull_request:

jobs:
  web-tests:
    name: Web tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node --test web/test/

  engine-syntax:
    name: Grasshopper engine syntax gate (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile engine
        run: python -m compileall -q grasshopper
